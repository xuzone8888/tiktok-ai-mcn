<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept B: Holographic Particle Molding</title>
    <style>
        body { margin: 0; padding: 0; background: #080a12; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; color: white; font-family: sans-serif;}
        
        .container { position: relative; width: 400px; height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .hologram-silhouette {
            width: 120px;
            height: 320px;
            /* Placeholder for a silhouette, using a stylized shape */
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: 60px 60px 20px 20px;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 80% 100%, 20% 100%, 0% 30%);
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,242,234,0.1);
            overflow: hidden;
        }

        .scan-line {
            position: absolute; width: 100%; height: 2px;
            background: #00F2EA;
            box-shadow: 0 0 20px 5px #00F2EA, 0 0 40px 10px #CCFF00;
            animation: scan 4s ease-in-out infinite alternate;
        }

        .particle-stream {
            position: absolute; inset: 0;
            opacity: 0.6;
            background-image: 
                radial-gradient(circle at center, #00F2EA 1px, transparent 2px),
                radial-gradient(circle at center, #CCFF00 1.5px, transparent 2px);
            background-size: 20px 20px, 30px 40px;
            background-position: 0 0, 15px 20px;
            animation: flowUp 2s linear infinite;
        }

        @keyframes scan { 0% { bottom: -10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { bottom: 110%; opacity: 0; } }
        @keyframes flowUp { from { background-position: 0 0, 15px 20px; } to { background-position: 0 -40px, 15px -20px; } }

        .progress-hud { margin-top: 40px; text-align: center; }
        .perc { font-size: 3rem; font-weight: 200; font-family: monospace; color: #CCFF00; text-shadow: 0 0 15px rgba(204,255,0,0.5); margin: 0; }
        .status { margin-top: 10px; font-size: 0.8rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        
        /* Particle flares around silhouette */
        .flare { position: absolute; border-radius: 50%; filter: blur(8px); mix-blend-mode: screen; animation: float 3s ease-in-out infinite alternate; }
        .f1 { width: 40px; height: 40px; background: rgba(0,242,234,0.4); left: -20px; top: 30%; }
        .f2 { width: 60px; height: 60px; background: rgba(236,72,153,0.3); right: -30px; top: 60%; animation-delay: -1s; }
        
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-40px); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="flare f1"></div>
        <div class="flare f2"></div>
        <div class="hologram-silhouette">
            <div class="particle-stream"></div>
            <div class="scan-line"></div>
        </div>
        <div class="progress-hud">
            <p class="perc">68%</p>
            <p class="status">Assembling Particles</p>
        </div>
    </div>
</body>
</html>
