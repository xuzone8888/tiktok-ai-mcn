server {
    listen 80;
    server_name media.toryxai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name media.toryxai.com;

    ssl_certificate /etc/nginx/ssl/media.toryxai.com.pem;
    ssl_certificate_key /etc/nginx/ssl/media.toryxai.com.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # Use systemd-resolved for runtime DNS resolution
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Variable-based upstream — triggers runtime DNS resolution
    set $oss_upstream tokfactory-videos.oss-cn-beijing.aliyuncs.com;

    location / {
        proxy_pass https://$oss_upstream;
        proxy_set_header Host $oss_upstream;

        # HTTPS backend requires SNI
        proxy_ssl_server_name on;
        proxy_ssl_name $oss_upstream;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Override OSS force-download headers to allow video playback in browser
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        add_header Content-Disposition 'inline' always;

        # Hide OSS CORS headers to prevent duplication
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;

        # Set clean CORS headers for canvas video frame capture
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        # Cache for better performance
        add_header Cache-Control 'public, max-age=86400' always;
    }
}
