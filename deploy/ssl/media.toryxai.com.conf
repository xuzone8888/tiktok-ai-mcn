server {
    listen 80;
    server_name media.toryxai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name media.toryxai.com;

    ssl_certificate /etc/nginx/ssl/media.toryxai.com.pem;
    ssl_certificate_key /etc/nginx/ssl/media.toryxai.com.key;
    
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # Proxy to OSS for media files
    location / {
        proxy_pass https://tokfactory-videos.oss-cn-beijing.aliyuncs.com;
        proxy_set_header Host tokfactory-videos.oss-cn-beijing.aliyuncs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Override OSS force-download headers to allow video playback in browser
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        add_header Content-Disposition 'inline' always;
        
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        
        # Cache for better performance
        add_header Cache-Control 'public, max-age=86400' always;
    }
}
