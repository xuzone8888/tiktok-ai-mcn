# Nginx systemd auto-restart override
# 部署位置: /etc/systemd/system/nginx.service.d/restart.conf
# 部署后执行: systemctl daemon-reload
#
# 背景: Ubuntu 默认的 nginx.service 没有 Restart= 指令,
# 任何启动失败(如 DNS 瞬时故障)都不会自动重试, 导致无人值守宕机。
# 2026-04-11 事故: OpenSSL 自动升级触发 Nginx 重启, DNS 瞬时解析失败,
# Nginx 停止后无自恢复, 网站宕机 28+ 小时。

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10s
