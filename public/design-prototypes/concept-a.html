<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept A: Sacred Geometry Genesis</title>
    <style>
        body { margin: 0; padding: 0; background: #050508; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; color: white; flex-direction: column; }
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,242,234,0.08) 0%, transparent 60%); pointer-events: none; mix-blend-mode: screen; }
        .bg-glow-pink { background: radial-gradient(circle, rgba(236,72,153,0.05) 0%, transparent 60%); margin-left: 200px; margin-top: 100px; }
        
        .geometry-container { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .core-orb { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 20px 5px #00F2EA, 0 0 60px 15px rgba(236,72,153,0.6); animation: pulse 3s ease-in-out infinite; }
        
        svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(0,242,234,0.6)); animation: rotate-slow 20s linear infinite; }
        .line { fill: none; stroke: rgba(0,242,234,0.8); stroke-width: 1.5; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 4s ease-in-out infinite alternate; }
        .circle { fill: none; stroke: rgba(236,72,153,0.5); stroke-width: 1; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 6s ease-in-out infinite alternate; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 30px 10px #00F2EA, 0 0 80px 20px rgba(236,72,153,0.8); } }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes rotate-slow { to { transform: rotate(360deg); } }
        
        .text-box { margin-top: 3rem; text-align: center; z-index: 10; }
        h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 0.2em; margin: 0 0 0.5rem; text-shadow: 0 0 10px rgba(0,242,234,0.5); }
        p { font-size: 0.8rem; color: rgba(255,255,255,0.4); font-family: monospace; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-pink"></div>
    
    <div class="geometry-container">
        <!-- Sacred Geometry Approximation -->
        <svg viewBox="0 0 100 100">
            <polygon class="line" points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" />
            <polygon class="line" points="50,95 5,27.5 95,27.5" style="animation-delay: 1s;" />
            <polygon class="line" points="50,5 95,72.5 5,72.5" style="animation-delay: 1.5s;" />
            <circle class="circle" cx="50" cy="50" r="45" />
            <circle class="circle" cx="50" cy="50" r="22.5" style="animation-duration: 3s;" />
        </svg>
        <div class="core-orb"></div>
    </div>
    
    <div class="text-box">
        <h1>SOUL FORGE</h1>
        <p>> CONFIGURING NEURAL PATHWAYS...</p>
    </div>
</body>
</html>
