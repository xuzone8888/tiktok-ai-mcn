<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色出场 — SaaS 级高质感预览</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

  body {
    background: #09090b; /* 极深灰，SaaS 标准暗色背景 */
    color: #ededed;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 极致克制的背景光 */
  .studio-lighting {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: 
      radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
      radial-gradient(circle at 50% 85%, rgba(0, 242, 234, 0.015) 0%, transparent 40%);
  }

  /* 辅助网格（SaaS 科技感） */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.2;
    background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
  }

  /* ==== 顶部导航占位 ==== */
  .top-nav {
    position: relative; z-index: 10;
    width: 100%; padding: 24px 40px;
    display: flex; align-items: center;
  }
  .btn-back {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px;
    background: transparent; border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-back:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.15); }

  /* ==== 主视觉区 ==== */
  .main-stage {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    width: 100%; flex: 1;
    margin-top: -20px; /* 微调视觉中心 */
  }

  /* 角色主卡片 */
  .hero-card {
    width: 360px;
    height: 480px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    /* 极致细腻的边框与阴影 */
    background: #111;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 
      0 0 0 1px rgba(0,0,0,0.5),
      0 20px 40px rgba(0,0,0,0.6), 
      inset 0 1px 1px rgba(255,255,255,0.05);
    animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .hero-card img {
    width: 100%; height: 100%; object-fit: cover;
  }
  @keyframes cardReveal {
    0% { opacity: 0; transform: scale(0.96) translateY(10px); filter: blur(4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  /* ==== 底边栏面板（SaaS 资产看板） ==== */
  .asset-dock {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .dock-panel {
    background: rgba(15, 15, 18, 0.65);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    width: max-content;
  }

  /* 面板头部 */
  .dock-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 12px;
  }

  .dock-title {
    font-size: 13px; font-weight: 500; color: #ededed;
    display: flex; align-items: center; gap: 8px;
  }
  .dock-title .sub { color: rgba(255,255,255,0.4); font-weight: 400; }

  /* 状态标签 */
  .status-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .status-badge .spinner {
    width: 12px; height: 12px;
    border: 1.5px solid rgba(255,255,255,0.2);
    border-top-color: #ededed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .status-badge.processing {
    background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.2); color: #60a5fa;
  }
  .status-badge.processing .spinner { border-top-color: #60a5fa; border-right-color: rgba(59, 130, 246, 0.3); border-bottom-color: rgba(59, 130, 246, 0.3); border-left-color: rgba(59, 130, 246, 0.3);}
  .status-badge.done {
    background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.2); color: #4ade80;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 胶片轨（多角度槽位） */
  .filmstrip {
    display: flex; gap: 12px;
  }

  .slot {
    width: 72px; height: 96px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* 骨架屏动画 - 类似 Vercel/Linear 的 shimmer */
  .skeleton {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, 
      rgba(255,255,255,0) 0%, 
      rgba(255,255,255,0.04) 50%, 
      rgba(255,255,255,0) 100%);
    background-size: 200% 100%;
    animation: shimmer 2s infinite linear;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .slot img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.5s ease;
  }

  .slot .angle-tag {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    padding: 3px 6px; border-radius: 4px;
    font-size: 10px; color: rgba(255,255,255,0.9);
    white-space: nowrap; opacity: 0; transition: opacity 0.5s ease;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* 完成状态交互 */
  .dock-panel.is-completed .slot { cursor: pointer; border-color: rgba(255,255,255,0.15); }
  .dock-panel.is-completed .slot:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .dock-panel.is-completed .slot img,
  .dock-panel.is-completed .slot .angle-tag { opacity: 1; }
  .dock-panel.is-completed .skeleton { display: none; }

  /* ==== 底部操作区 ==== */
  .actions {
    display: flex; gap: 16px;
    animation: fadeIn 0.5s ease 0.3s forwards; opacity: 0;
  }

  .btn {
    padding: 10px 24px; border-radius: 8px;
    font-size: 13.5px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    border: none;
  }
  .btn-outline {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .btn-primary {
    background: #fff; color: #000; box-shadow: 0 2px 10px rgba(255,255,255,0.1);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,255,255,0.15); }

  /* Demo Toggle - Top Right */
  .demo-controls {
    position: fixed; top: 24px; right: 40px; z-index: 100;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    padding: 6px; border-radius: 8px; display: flex; gap: 4px; backdrop-filter: blur(10px);
  }
  .demo-controls button {
    padding: 6px 14px; border-radius: 4px; border: none;
    background: transparent; color: rgba(255,255,255,0.5);
    font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: 500;
  }
  .demo-controls button:hover { color: rgba(255,255,255,0.9); }
  .demo-controls button.active { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>

  <!-- 高级 SaaS 环境背景 -->
  <div class="studio-lighting"></div>
  <div class="grid-bg"></div>

  <!-- 顶部面包屑/返回 -->
  <div class="top-nav">
    <button class="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      角色配置
    </button>
  </div>

  <div class="demo-controls">
    <button class="active" onclick="switchState('generating', this)">生成中</button>
    <button onclick="switchState('completed', this)">已完成</button>
  </div>

  <!-- 主视觉区 -->
  <div class="main-stage">
    
    <div class="hero-card">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=800&q=80" alt="Hero">
    </div>

    <!-- 资产面板（SaaS 风格容器） -->
    <div class="asset-dock">
      
      <div class="dock-panel is-generating" id="dockPanel">
        <!-- 面板头 -->
        <div class="dock-header">
          <div class="dock-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            角色资产
            <span class="sub">/ 多角度扩展图</span>
          </div>
          
          <div class="status-badge processing" id="statusBadge">
            <div class="spinner" id="statusIcon"></div>
            <span id="statusText">正在同步生成</span>
          </div>
        </div>

        <!-- 胶片轨：6 个槽位 -->
        <div class="filmstrip">
          <div class="slot">
            <div class="skeleton"></div>
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=50" alt="">
            <span class="angle-tag">正面</span>
          </div>
          <div class="slot">
            <div class="skeleton"></div>
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=50" alt="">
            <span class="angle-tag">左 ¾</span>
          </div>
          <div class="slot">
            <div class="skeleton"></div>
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=50" alt="">
            <span class="angle-tag">左侧</span>
          </div>
          <div class="slot">
            <div class="skeleton"></div>
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=50" alt="">
            <span class="angle-tag">右 ¾</span>
          </div>
          <div class="slot">
            <div class="skeleton"></div>
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=50" alt="">
            <span class="angle-tag">右侧</span>
          </div>
          <div class="slot">
            <div class="skeleton"></div>
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=50" alt="">
            <span class="angle-tag">背面</span>
          </div>
        </div>
      </div>

      <!-- 全局操作 -->
      <div class="actions">
        <button class="btn btn-outline">预览角色影片</button>
        <button class="btn btn-primary">保存并进入控制台</button>
      </div>

    </div>
  </div>

  <script>
    function switchState(state, btnEl) {
      document.querySelectorAll('.demo-controls button').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');

      const dock = document.getElementById('dockPanel');
      const statusBadge = document.getElementById('statusBadge');
      const statusIcon = document.getElementById('statusIcon');
      const statusText = document.getElementById('statusText');

      if (state === 'generating') {
        dock.className = 'dock-panel is-generating';
        statusBadge.className = 'status-badge processing';
        statusIcon.className = 'spinner';
        statusIcon.innerHTML = '';
        statusText.textContent = '正在同步生成';
      } else {
        dock.className = 'dock-panel is-completed';
        statusBadge.className = 'status-badge done';
        statusIcon.className = '';
        statusIcon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        statusText.textContent = '生成完毕';
      }
    }
  </script>
</body>
</html>
