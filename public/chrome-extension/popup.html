<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #00f5d4, #ff006e);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }
    .section {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #00f5d4;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f5d4;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00f5d4, #00d4aa);
      color: #000;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,245,212,0.3);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }
    .threads {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .thread-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .thread-btn.active {
      border-color: #00f5d4;
      background: rgba(0,245,212,0.1);
      color: #00f5d4;
    }
    .thread-btn:hover {
      border-color: #00f5d4;
    }
    .info {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 12px;
      text-align: center;
    }
    .download-queue {
      max-height: 120px;
      overflow-y: auto;
    }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    .queue-item:last-child {
      border-bottom: none;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00f5d4, #ff006e);
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">TF</div>
    <div>
      <div class="title">Tok Factory 助手</div>
      <div class="subtitle">v2.0 - 多线程下载加速</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>⚡</span> 下载加速设置
    </div>
    <div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 8px;">
      线程数量（越多越快，但可能被限速）
    </div>
    <div class="threads">
      <button class="thread-btn" data-threads="2">2线程</button>
      <button class="thread-btn active" data-threads="4">4线程</button>
      <button class="thread-btn" data-threads="8">8线程</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>📥</span> 下载队列
    </div>
    <div class="download-queue" id="downloadQueue">
      <div style="font-size: 12px; color: rgba(255,255,255,0.5); text-align: center; padding: 16px;">
        暂无下载任务<br>
        <span style="font-size: 11px;">在视频批量页面点击"插件下载"开始</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>📊</span> 状态
    </div>
    <div class="status">
      <div class="status-dot"></div>
      <span>已连接到 Tok Factory</span>
    </div>
  </div>

  <button class="btn btn-secondary" id="openTokFactory">
    打开 Tok Factory
  </button>

  <div class="info">
    💡 提示：安装后在视频批量页面使用"插件下载"功能
  </div>

  <script src="popup.js"></script>
</body>
</html>
